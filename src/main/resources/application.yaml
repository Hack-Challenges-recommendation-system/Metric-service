spring:
  application:
    name: metric-service
  mvc:
    servlet:
      path: /api/v1
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5438/postgres}
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
      naming:
        physical-strategy: org.hibernate.boot.model.naming.CamelCaseToUnderscoresNamingStrategy
    show-sql: false
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:database/migrations

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    root: INFO
  file:
    name: /logs/metric-service.log
  structured:
    format:
      file: ecs # Loki supports it
      console: ecs
    json:
      exclude: ecs

app:
  events:
    # e.g. file:/data/events.json; empty skips the import
    import-path: ${EVENTS_IMPORT_PATH:}

management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    distribution:
      percentiles-histogram:
        http.server.requests: true
